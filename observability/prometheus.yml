global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: payments-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payments-api:8081"]

  - job_name: audit-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["audit-api:8082"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
